# Publishes the graded build to GitHub Pages as an archive.
#
# WHY THIS EXISTS. This app was served from Render at
# meridian-frontend-f6af.onrender.com until that account was wound down. The
# service is gone and the URL returns 404, so the graded artefact is rebuilt
# here and served from Pages instead.
#
# The app has no API routes and no server actions, so output:'export' produces
# the same client-side application. STATIC_EXPORT and ARCHIVE_BASE_PATH are read
# by next.config.mjs; the normal server build is unaffected.

name: Deploy archive to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # No version pin: the repo's package.json already sets packageManager,
      # and specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      # pnpm 11 requires Node >= 22.13; Node 20 fails with
      # ERR_UNKNOWN_BUILTIN_MODULE on node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build static export
        env:
          STATIC_EXPORT: '1'
          ARCHIVE_BASE_PATH: /meridian
        run: pnpm exec next build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
